name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App (Vite)
        run: npm run build

      - name: Add Android platform if not present
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android assets & plugins
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Organize Single Mega APK Artifact
        run: |
          mkdir -p build-artifacts
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/MAUSAM.apk
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/MAUSAM.apk
          fi
          ls -lh build-artifacts/

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mausam-mega-apk
          path: build-artifacts/MAUSAM.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "MAUSAM Mega Unified App v2.0.0 (Official Single Android APK)"
          make_latest: true
          body: |
            ### 🇮🇳 MAUSAM Mega Unified Meteorological Intelligence Platform (Android APK v2.0.0)

            This is the **Mega Single Project** release containing the complete, consolidated India Meteorological Department (IMD) intelligence suite bundled into a **single, standalone APK file**.

            #### 📦 Single Direct Download:
            - **[MAUSAM.apk](https://github.com/gobikrishnav/mausam-app/releases/download/v2.0.0/MAUSAM.apk)** (Signed, Production-Ready, 1-Tap Install)

            #### 🌟 Unified Features Included in this Single Mega App:
            - **On-Device Offline ML Personalization Engine (M-AWPM v1.2)**:
              - 12-dimensional meteorological feature ranking
              - Thom's Discomfort Index ($DI$) biometeorological evaluation
              - Active online reinforcement learning (`👍 Helpful` / `👎 Refine`)
              - Real-time interactive ML Hub Inspector Modal (~1.4 ms latency, 0 KB data transfer)
            - **Voice Weather Briefings**:
              - AI-synthesized weather briefing with text-to-speech audio playback
            - **Full IMD Observation & Forecasting Suite**:
              - Surface meteorological observations (MSLP pressure, humidity, dew point, 24h precipitation)
              - 4-Color IMD Severe Warning Matrix (Red / Orange / Yellow / Green)
              - 3-Hour Rapid Nowcast countdown bulletin with lightning safety instructions
              - 7-Day interactive trend graphs and hourly predictions
              - Multi-spectral INSAT-3D/3DR satellite viewer (Thermal IR, Water Vapor, Visible)
              - Interactive Leaflet Doppler Radar & GIS maps with live cloud, wind, precipitation, and traffic overlays
            - **Sector-Specific Lifestyles (8 Personas)**:
              - Agriculture / Farmers (Meghdoot agro-meteorology, crop spraying advisory)
              - Commuters & Travelers (traffic precipitation risk, fog index)
              - Outdoor Sports & Fitness (heat index, AQI outdoor cardio windows)
              - Marine & Fishermen (INCOIS wave swell, coastal squall warnings)
              - Health & Vulnerable (air quality, dust, allergen risk)
              - Event Planners, Parents, and Beachgoers
            - **Emergency Helplines Directory**:
              - 1-tap direct dialers for NDMA (1078), National Emergency (112), State Disaster (1070), and District Disaster (1077)
            - **Resilient Authentication**:
              - Clerk Cloud Auth integration with fail-safe error boundary and instant 1-tap Guest Citizen access
            - **Safe Mobile UI**:
              - Universal Android 7.0+ (API 24 to API 35) support
              - Notch and hole-punch camera safe-area padding
              - Floating navigation clearance
          files: build-artifacts/MAUSAM.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
