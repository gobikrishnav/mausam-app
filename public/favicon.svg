<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Square White Container -->
  <rect width="100" height="100" rx="22" fill="#FFFFFF" />
  
  <!-- Navy Circular Core -->
  <circle cx="50" cy="50" r="38" fill="#082046" />
  
  <!-- Golden Sun -->
  <circle cx="61" cy="40" r="14" fill="#FCD350" />
  
  <!-- White Weather Cloud -->
  <circle cx="48" cy="45" r="17" fill="#FFFFFF" />
  <circle cx="34" cy="52" r="12" fill="#FFFFFF" />
  <circle cx="64" cy="53" r="10" fill="#FFFFFF" />
  <rect x="29" y="47" width="41" height="14" rx="7" fill="#FFFFFF" />
  
  <!-- 3 Slanted Cyan Raindrops -->
  <g stroke="#028ED3" stroke-width="3.5" stroke-linecap="round">
    <line x1="40" y1="65" x2="37" y2="72" />
    <line x1="50" y1="65" x2="47" y2="72" />
    <line x1="60" y1="65" x2="57" y2="72" />
  </g>
</svg>